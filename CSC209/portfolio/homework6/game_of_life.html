<!DOCTYPE html>
<html>
<head>
  <title>Technical</title>
  <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
  <link rel="stylesheet" href="../assets/stylesheets/game_of_life.css">
  <link rel="stylesheet" href="../assets/stylesheets/global.css">
  <link rel="stylesheet" href="../assets/stylesheets/dark_mode.css">
  <script src="../assets/javascript/buttons.js"></script>
  <script src="../assets/javascript/game_of_life.js"></script>
</head>
<body class="dark-mode" onload="setupGame()">

<header>
  <h2>Game of Life</h2><hr>
</header>
<br>
<section><article>
  <div id="game-container">
  </div><br>

  <div id="controls">
    <button id="game-start" class="button" onclick="start(this)">START</button>
    <button id="game-step" class="button" onclick="stepOnce()">STEP</button>
    <button id="game-stop" class="button" onclick="stop(this)" disabled="true">STOP</button>
    <button id="game-reset" class="button" onclick="reset(this)">RESET</button>
  </div>
</article></section>

<footer>
  <hr>
  <div>Technical: 480 minutes</div>
  <hr>
  <h3><a href="../start_page.html">Return to home</a></h3>
</footer>

</body>
</html>
