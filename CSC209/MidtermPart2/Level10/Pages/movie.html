<!DOCTYPE html>
<html>
<head>
  <title>Technical</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../font-awesome-4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="../css/iconbar.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animation.css">
  <script src="../js/animation.js"></script>
</head>
<body onload="sceneSet()">

<div class="icon-bar">
  <a href="../home.html"><i class="fa fa-home"></i></a> 
  <a href="./search.html"><i class="fa fa-search"></i></a> 
  <a href="./photo.html"><i class="fa fa-photo"></i></a>  
  <a class="active" href=".#"><i class="fa fa-file-movie-o"></i></a>
  <a href="./accordion.html"><i class="fa fa-download"></i></a>
  <a href="./print.html"><i class="fa fa-print"></i></a>
  <a href="./trash.html"><i class="fa fa-trash"></i></a> 
</div>

<section>
  <div>
    <hr>
    <button id="animate-toggle" onclick="toggleAnimation(this)" data-mode="start">Dance!</button>
    <br><br>
    <label for="particle-count">Number of particles: </label>
      <input id="particle-count" type="number" value="15" min="1" onblur="updateParts()"><br><br>
    <label for="temperature">Temperature: </label>
      <select id="temperature">
      <option value=3>Hot</option>
      <option value=2>Mid</option>
      <option value=1 selected="true">Cold</option>
      </select><br><br>
    <label for="trace">Trace: </label>
      <select id="trace">
      <option value=2>Full Trace</option>
      <option value=1 selected="true">Fade Out</option>
      <option value=0>None</option>
      </select><br><br>
    <label for="collider"> Allow Collisions: </label>
      <input id="collider" type="checkbox"><br><br>
    <button id="initializer" onclick="stage.redraw()">Reset Particles</button>
    <button id="reloader" onclick="stage.regenerate()">Regenerate Particles</button>
    <hr>
  </div>
  
  <div id="animation-container"></div>
</section>

</body>
</html>
