<!DOCTYPE html>
<html>
<style>
#container {
  width: 400px;
  height: 400px;
  position: relative;
  background: yellow;
}
#animate {
  width: 50px;
  height: 50px;
  position: absolute;
  background-color: red;
}
</style>
<body>

<p><button id="animator" onclick="myMove()">Click Me</button></p> 

<div id ="container">
  <div id ="animate"></div>
</div>

<script>
function myMove() {
  document.getElementById("animator").disabled = true; // disable her
  let id = null;
  const elem = document.getElementById("animate");   
  let pos = 0;
  clearInterval(id);
  id = setInterval(frame, 5);
  function frame() {
    if (pos == 350) {
      document.getElementById("animator").disabled = true;
      clearInterval(id);
    } else {
      pos++; 
      elem.style.top = pos + "px";
      elem.style.left = pos + "px";
    }
  }
}
</script>

<hr>

</body>
</html>
