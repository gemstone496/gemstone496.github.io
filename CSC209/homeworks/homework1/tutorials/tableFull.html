<!DOCTYPE html>
<html>
<head>
<title>Formatted Table</title>
<link rel="icon" type="image/x-icon" href="/public-webpage/CSC209/assets/images/favicon.ico">
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: fit-content;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

tr:nth-child(even) {
  background-color: #dddddd;
}
</style>
</head>
<body>

<h2>HTML Table With Styling</h2>
<div>Exercise pulled from 
  <a href="https://www.w3schools.com/html/html_tables.asp">W3Schools</a>
</div>

<table>
  <tr>
    <th>Hey</th>
    <th>Look</th>
    <th>At</th>
  </tr>
  <tr>
    <td>Me, I'm A</td>
    <td>Beautiful</td>
    <td>Butterfly</td>
  </tr>
  <tr>
    <td>And I Can Totally</td>
    <td>Think</td>
    <td>Of</td>
  </tr>
  <tr>
    <td>Info To Enter</td>
    <td>Into This</td>
    <td>Table</td>
  </tr>
  <tr>
    <td>And Also Isn't The</td>
    <td>Table Styling</td>
    <td>CSS</td>
  </tr>
  <tr>
    <td>Which We're Not To</td>
    <td>Pay Attention</td>
    <td>To?</td>
  </tr>
</table>
