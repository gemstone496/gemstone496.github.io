<!DOCTYPE html>
<html>
<head>
  <title>Technical</title>
  <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
  <link rel="stylesheet" href="../assets/stylesheets/global.css">
  <link rel="stylesheet" href="../assets/stylesheets/dark_mode.css">
  <link rel="stylesheet" href="../assets/stylesheets/technical.css">
  <script src="../assets/javascript/buttons.js"></script>
  <script src="../assets/javascript/particle_physics.js"></script>
</head>
<body class="dark-mode">

<section>
  <div>
    <hr>
    <label for="particle-count">Number of particles: </label>
      <input id="particle-count" type="number" value="1" min="1" step="1"><br><br>
    <label for="tile-speed">Temperature: </label>
      <select id="tile-speed">
      <option value=1>Hot</option>
      <option value=2 selected="true">Mid</option>
      <option value=3>Cold</option>
      </select><br><br>
    <button id="initializer" onclick="sceneSet()">Set Stage</button><br><br>
    <button id="animate-start" onclick="begin(this)" disabled="true">Dance!</button>
    <button id="animate-stop" onclick="freeze(this)" disabled="true">FREEZE</button>
    <hr>
  </div>

  <canvas id ="animation-container">
  </div>
</section>

<footer>
  <hr>
  <button id="dark-button" class="button" onclick="darkToggle()">Light Mode</button>
  <hr>
  <div>Technical: 300 minutes</div>
  <hr>
  <h3><a href="./start_page.html">Return to home</a></h3>
</footer>

</body>
</html>
