<!DOCTYPE html>
<html>
<head>
<title>Table Grouping</title>
<link rel="icon" type="image/x-icon" href="/public-webpage/CSC209/assets/favicon/favicon.ico">
<style>
table, th, td {
  border: 1px solid black;
  border-collapse: collapse;
}
</style>
</head>
<body>

<h2>Colgroup</h2>
<p>Defines different styling for group of 2 leftmost columns</p>
<div>Exercise pulled from 
  <a href="https://www.w3schools.com/html/html_table_colgroup.asp">W3Schools</a>
</div>

<table style="width: 100%;">
<colgroup>
  <col span="2" style="background-color: #aab0dd">
</colgroup>
<tr>
<th>MON</th>
<th>TUE</th>
<th>WED</th>
<th>THU</th>
<th>FRI</th>
<th>SAT</th>
<th>SUN</th>
</tr>
<tr>
<td>1</td>
<td>2</td>
<td>3</td>
<td>4</td>
<td>5</td>
<td>6</td>
<td>7</td>
</tr>
<tr>
<td>8</td>
<td>9</td>
<td>10</td>
<td>11</td>
<td>12</td>
<td>13</td>
<td>14</td>
</tr>
<tr>
<td>15</td>
<td>16</td>
<td>17</td>
<td>18</td>
<td>19</td>
<td>20</td>
<td>21</td>
</tr>
<tr>
<td>22</td>
<td>23</td>
<td>24</td>
<td>25</td>
<td>26</td>
<td>27</td>
<td>28</td>
</tr>
</table>

</html>
